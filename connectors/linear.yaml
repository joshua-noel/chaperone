# Linear: the ops Chaperone has built. The full research profile (the ops not built yet, the
# presets) belongs to the connector standard, a design document outside this repository.
#
# Tied to api/manual.yaml, the baseline pack and the `chap` usage by the C19 test
# (internal/policy/profile_test.go).
#
# Two families:
#   intake.*  the operator board. Frozen names. For the orchestrator token only: no key can hold
#             them. Project policy: `linear:` {team, label, states}.
#   issue.*   the generic issue family, shared with GitHub's names. For the orchestrator token only:
#             a custom key cannot hold an issue.* op (internal/ops/keyceiling.go). In the project's
#             `linear.issues` team only. OFF in the baseline (issue.comment's name is on for GitHub;
#             Linear's adapter refuses a project with no `linear.issues` block, and refuses a comment
#             unless the block sets `comment: true`).
#
# `intake_label_excluded` (the security review's first finding): no issue.* op may read, list,
# comment on, label, move or link an item that is in the intake team or carries the intake label. A
# test requires the condition on every issue.* op of this file, and the adapter tests prove it per op.
#
# Not built, waiting for the operator's yes: issue.open, issue.update.
profile_version: 1
connector: linear
standard: v1.1

ops:
  - {name: intake.list,    class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: true,  chap: intake list,    orchestrator_only: true,
     conditions: [orchestrator_only, team_in_scope, not_engineering_team, rate, client_hourly_budget, secret_text_withheld]}
  - {name: intake.comment, class: routine, reversibility: compensable, surface: op, unit: team, enabled_default: true,  chap: intake comment, orchestrator_only: true,
     conditions: [orchestrator_only, team_in_scope, not_engineering_team, label_present_now, content_guard_secret, rate, client_hourly_budget]}
  - {name: intake.move,    class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: true,  chap: intake move,    orchestrator_only: true,
     conditions: [orchestrator_only, team_in_scope, not_engineering_team, label_present_now, state_in_policy, rate, client_hourly_budget]}
  - {name: intake.states,  class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: true,  chap: intake states,  orchestrator_only: true,
     conditions: [orchestrator_only, team_in_scope, not_engineering_team, rate, client_hourly_budget]}

  - {name: issue.get,      class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: false, chap: issue get, orchestrator_only: true,
     conditions: [team_in_scope, not_engineering_team, intake_label_excluded, rate, client_hourly_budget, secret_text_withheld]}
  - {name: issue.list,     class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: false, chap: issue list, orchestrator_only: true,
     conditions: [team_in_scope, not_engineering_team, intake_label_excluded, bulk_cap_page, rate, client_hourly_budget, secret_text_withheld]}
  - {name: issue.comment,  class: routine, reversibility: compensable, surface: op, unit: team, enabled_default: true,  chap: issue comment, orchestrator_only: true, needs_policy_block: linear.issues,
     conditions: [comment_enabled, team_in_scope, not_engineering_team, intake_label_excluded, label_present_now, content_guard_secret, no_broadcast_mentions, no_board_reference, rate, client_hourly_budget]}
  - {name: issue.label,    class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: false, chap: issue label, orchestrator_only: true,
     conditions: [team_in_scope, not_engineering_team, intake_label_excluded, label_present_now, label_in_policy_list, provenance_label_immutable, rate, client_hourly_budget]}
  - {name: issue.move,     class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: false, chap: issue move, orchestrator_only: true,
     conditions: [team_in_scope, not_engineering_team, intake_label_excluded, label_present_now, state_in_policy, rate, client_hourly_budget]}
  - {name: issue.link,     class: routine, reversibility: reversible,  surface: op, unit: team, enabled_default: false, chap: issue link, orchestrator_only: true,
     conditions: [team_in_scope, not_engineering_team, intake_label_excluded, label_present_now, link_host_allowlist, no_board_reference, content_guard_secret, rate, client_hourly_budget]}

# Names the standard has for Linear that are not built.
standard_not_built: [issue.open, issue.update]
