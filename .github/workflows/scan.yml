name: scan

# Slow scans that do not need to run on every push.
on:
  # Mondays 05:23 UTC. A new advisory shows up here within a week.
  schedule:
    - cron: "23 5 * * 1"
  # A PR that changes the dependency set is the moment a new vulnerability can
  # come in, so it gets the scan too.
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
