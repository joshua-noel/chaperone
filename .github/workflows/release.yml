name: release

# Builds the release archives for a version tag and leaves them in a DRAFT
# GitHub release. A person reads the draft, checks it (docs/releasing.md) and
# publishes it. Nothing here signs a binary and nothing here publishes.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# By hand (to build a tag again), pick the tag in the "Use workflow from" box
# of the Actions tab, or run `gh workflow run release -r v0.2.0`. A branch is
# refused: the version comes from the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Two runs for one tag would race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  # Read-only: it runs the project's own code (the tests) with no write access
  # to the repository.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: the ref is a version tag, and its commit is on main
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::this workflow builds a version tag; it was started on the $REF_TYPE '$TAG'"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit of $TAG is not on main. Release from main."
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  release:
    name: build and draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only write permission in this repository's workflows: it creates the
    # draft release. The job builds with the Go toolchain and the vendored
    # modules and runs no test code; the token is given to the `gh` step only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # The linker flags are those of scripts/build.sh (-trimpath, -s -w, the
      # version and the commit). That script builds only windows/amd64 and
      # linux/amd64 for CI, so the release has its own loop; keep the two flag
      # strings the same.
      - name: build the archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=github.com/joshua-noel/chaperone/internal/version
          ldflags="-s -w -X ${pkg}.Version=${TAG} -X ${pkg}.Commit=${GITHUB_SHA}"
          # File times in the archives are the commit time, so a rebuild of the
          # same commit gives the same archive bytes.
          epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          rm -rf dist
          mkdir -p dist/stage dist/out

          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="chaperone_${TAG}_${os}_${arch}"
            dir="dist/stage/$name"
            mkdir -p "$dir"

            ext=""
            bins="chapd chap"
            if [ "$os" = windows ]; then
              ext=".exe"
              bins="chapd chap chap-host"
            fi
            for bin in $bins; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$dir/$bin$ext" "./cmd/$bin"
            done
            cp LICENSE NOTICE README.md "$dir/"
            find "$dir" -exec touch -d "@$epoch" {} +

            if [ "$os" = windows ]; then
              (cd dist/stage && zip -X -q -r "../out/$name.zip" "$name")
            else
              tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
                -C dist/stage -cf - "$name" | gzip -n -9 > "dist/out/$name.tar.gz"
            fi
          done

          (cd dist/out && sha256sum -- chaperone_* > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -l dist/out

      # The runner is linux/amd64, so that archive can be run: it must report
      # the tag. Every archive is also listed, to catch a missing file.
      - name: check the archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run_dir="dist/stage/chaperone_${TAG}_linux_amd64"
          for bin in chap chapd; do
            out="$("$run_dir/$bin" version)"
            echo "$out"
            case "$out" in
              *" ${TAG} (commit ${GITHUB_SHA:0:12})"*) ;;
              *) echo "::error::$bin reports the wrong version or commit"; exit 1 ;;
            esac
          done
          for f in dist/out/*.tar.gz; do
            echo "== $f"; tar -tzf "$f"
          done
          for f in dist/out/*.zip; do
            echo "== $f"; unzip -l "$f"
          done

      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          **Draft. Read docs/releasing.md before you publish it.**

          The programs are **not signed and not notarised**. macOS and Windows
          will warn when you run a downloaded copy. Check a download against
          \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`, or \`shasum -a 256 -c\` on
          macOS, or \`Get-FileHash -Algorithm SHA256\` on Windows).

          Built from commit ${GITHUB_SHA} by ${RUN_URL}.

          | Archive | System |
          | --- | --- |
          | \`chaperone_${TAG}_windows_amd64.zip\` | Windows, 64-bit Intel/AMD (\`chapd\`, \`chap\`, \`chap-host\`) |
          | \`chaperone_${TAG}_linux_amd64.tar.gz\` | Linux, 64-bit Intel/AMD (\`chapd\`, \`chap\`) |
          | \`chaperone_${TAG}_linux_arm64.tar.gz\` | Linux, 64-bit ARM (\`chapd\`, \`chap\`) |
          | \`chaperone_${TAG}_darwin_arm64.tar.gz\` | macOS, Apple silicon (\`chapd\`, \`chap\`) |
          | \`chaperone_${TAG}_darwin_amd64.tar.gz\` | macOS, Intel (\`chapd\`, \`chap\`) |
          EOF
          flags=(--draft --verify-tag --title "$TAG" --notes-file "$notes")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/out/*
          echo "A draft release for $TAG was created. Check it, then publish it by hand."
